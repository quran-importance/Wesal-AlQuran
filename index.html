<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE6D0">
<title>وصال القرآن | رحلة تثبيت القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l2.6 4.2 4.8-1.1-1.1 4.8 4.2 2.6-4.2 2.6 1.1 4.8-4.8-1.1L12 22.5l-2.6-4.2-4.8 1.1 1.1-4.8L1.5 12l4.2-2.6-1.1-4.8 4.8 1.1z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 48 48"><path fill="currentColor" d="M30.5 4.5A19.5 19.5 0 1 0 43.5 36 16 16 0 1 1 30.5 4.5z"/><path fill="currentColor" d="M37 10l1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z"/></symbol>
  <symbol id="i-sprig" viewBox="0 0 80 80"><path d="M8 74C26 58 44 40 70 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><g fill="currentColor"><ellipse cx="22" cy="58" rx="9" ry="4" transform="rotate(-62 22 58)"/><ellipse cx="30" cy="56" rx="9" ry="4" transform="rotate(8 30 56)"/><ellipse cx="34" cy="42" rx="9" ry="4" transform="rotate(-62 34 42)"/><ellipse cx="44" cy="40" rx="9" ry="4" transform="rotate(8 44 40)"/><ellipse cx="48" cy="26" rx="8" ry="3.6" transform="rotate(-62 48 26)"/><ellipse cx="57" cy="24" rx="8" ry="3.6" transform="rotate(8 57 24)"/><circle cx="70" cy="8" r="3.4"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke="currentColor" stroke-width="1.8" fill="none"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-flower" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="6" r="3.2"/><circle cx="18" cy="12" r="3.2"/><circle cx="12" cy="18" r="3.2"/><circle cx="6" cy="12" r="3.2"/></g><circle cx="12" cy="12" r="2.6" fill="var(--paper)"/></symbol>
</svg>

<div class="wrap">
  <div id="sec-top"></div>
  <header class="hero">
    <svg class="moon" aria-hidden="true"><use href="#i-moon"/></svg>
    <svg class="moon2" aria-hidden="true"><use href="#i-star"/></svg>
    <svg class="orn" viewBox="0 0 300 40" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M150 30C120 30 95 12 40 20"/><path d="M150 30C180 30 205 12 260 20"/></g>
      <g fill="currentColor" opacity=".9">
        <ellipse cx="62" cy="15" rx="7" ry="3" transform="rotate(-20 62 15)"/><ellipse cx="82" cy="22" rx="7" ry="3" transform="rotate(25 82 22)"/><ellipse cx="104" cy="19" rx="7" ry="3" transform="rotate(-15 104 19)"/><ellipse cx="124" cy="27" rx="6" ry="2.6" transform="rotate(20 124 27)"/>
        <ellipse cx="238" cy="15" rx="7" ry="3" transform="rotate(20 238 15)"/><ellipse cx="218" cy="22" rx="7" ry="3" transform="rotate(-25 218 22)"/><ellipse cx="196" cy="19" rx="7" ry="3" transform="rotate(15 196 19)"/><ellipse cx="176" cy="27" rx="6" ry="2.6" transform="rotate(-20 176 27)"/>
      </g>
      <g fill="var(--gold)"><circle cx="40" cy="20" r="2.4"/><circle cx="260" cy="20" r="2.4"/><path d="M150 18l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g>
    </svg>
    <h1>وِصال القرآن</h1>
    <p class="sub">رحلة تثبيت القرآن</p>
    <p class="tag">وردٌ يتجدد، وحفظٌ يترسّخ، وصحبةٌ على طريق القرآن</p>
  </header>
  <div id="app"><div class="loading"><svg aria-hidden="true"><use href="#i-star"/></svg><p>جارٍ تحميل اللوحة…</p></div></div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
